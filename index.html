<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odds Notepad · Colored Lines</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      direction: ltr !important;
      text-align: left !important;
      unicode-bidi: isolate !important;
      writing-mode: horizontal-tb !important;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4ff;
      padding: 1.5rem;
    }

    #root {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .notepad {
      background: #fffdf5;
      border-radius: 28px;
      box-shadow:
        0 20px 35px rgba(0, 0, 0, 0.15),
        0 6px 12px rgba(0, 0, 0, 0.08);
      padding: 1.8rem;
      border: 1px solid rgba(59, 130, 246, 0.3);
      direction: ltr !important;
      text-align: left !important;
    }

    .stats-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.75rem;
      border-bottom: 3px dashed #3b82f6;
      padding-bottom: 0.75rem;
      direction: ltr !important;
    }

    .stats-header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      direction: ltr !important;
      text-align: left !important;
    }

    .badge {
      background: #dbeafe;
      color: #1e3a8a;
      padding: 0.35rem 1rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.85rem;
      border: 1px solid #60a5fa;
      direction: ltr !important;
      text-align: left !important;
    }

    .notepad-body {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #bfdbfe;
      overflow: hidden;
      height: 520px;
      direction: ltr !important;
    }

    .editor-scroll {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      background: #ffffff;
      direction: ltr !important;
    }

    .editor-scroll::-webkit-scrollbar {
      width: 8px;
    }

    .editor-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .editor {
      padding: 0.75rem 1rem;
      font-family: 'Courier New', 'Fira Code', monospace;
      font-size: 1rem;
      line-height: 1.65rem;
      color: #1e293b;
      font-weight: 500;
      min-height: 100%;
      outline: none;

      /* Force English-style left-to-right writing */
      direction: ltr !important;
      text-align: left !important;
      unicode-bidi: isolate !important;
      writing-mode: horizontal-tb !important;
    }

    .line-row {
      display: block;
      width: 100%;
      line-height: 1.65rem;
      height: 1.65rem;
      border-radius: 4px;
      transition: background-color 0.3s ease;
      padding: 0 0.5rem;
      overflow: hidden;
      position: relative;

      /* Force every row to write left-to-right */
      direction: ltr !important;
      text-align: left !important;
      unicode-bidi: isolate !important;
      writing-mode: horizontal-tb !important;
    }

    .line-text {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      cursor: text;

      font-family: 'Courier New', 'Fira Code', monospace;
      font-size: inherit;
      font-weight: inherit;
      line-height: 1.65rem;
      color: inherit;

      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;

      /*
       * These rules make typing behave like an English keyboard:
       * characters begin on the left and continue toward the right.
       */
      direction: ltr !important;
      text-align: left !important;
      unicode-bidi: isolate !important;
      writing-mode: horizontal-tb !important;

      /* Prevent ligatures from changing the visual typing position */
      font-variant-ligatures: none;
      -webkit-font-variant-ligatures: none;
    }

    .line-text:focus {
      direction: ltr !important;
      text-align: left !important;
      unicode-bidi: isolate !important;
      writing-mode: horizontal-tb !important;
    }

    .line-text::-webkit-scrollbar {
      display: none;
    }

    .line-text::selection {
      background: #93c5fd;
      color: #0f172a;
    }

    /* Force any browser-created editable content to remain LTR */
    .line-text *,
    .line-text span,
    .line-text div,
    .line-text br {
      direction: ltr !important;
      text-align: left !important;
      unicode-bidi: isolate !important;
      writing-mode: horizontal-tb !important;
    }

    .editor .line-row:only-child .line-text:empty::before {
      content: attr(data-placeholder);
      color: #94a3b8;
      font-style: italic;
      pointer-events: none;
    }

    .stats-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.25rem;
      flex-wrap: wrap;
      gap: 1rem;
      direction: ltr !important;
    }

    .stat-item {
      background: #eff6ff;
      border-radius: 40px;
      padding: 0.4rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #1e3a8a;
      border: 1px solid #bfdbfe;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      direction: ltr !important;
    }

    .storage-note {
      font-size: 0.75rem;
      color: #1e3a8a;
      background: #eff6ff;
      padding: 0.25rem 0.75rem;
      border-radius: 30px;
      border: 1px solid #bfdbfe;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      direction: ltr !important;
    }

    .storage-note::before {
      content: "💾";
    }

    .button-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      direction: ltr !important;
    }

    .clear-button,
    .clear-all-button {
      font-family: inherit;
      font-weight: 700;
      padding: 0.5rem 1.4rem;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s;
      direction: ltr !important;
    }

    .clear-button {
      background: #eff6ff;
      border: 1.5px solid #2563eb;
      color: #1e3a8a;
      box-shadow: 0 3px 0 #1e40af;
    }

    .clear-all-button {
      background: #fee2e2;
      border: 1.5px solid #dc2626;
      color: #991b1b;
      box-shadow: 0 3px 0 #b91c1c;
    }

    .clear-button:hover,
    .clear-all-button:hover {
      transform: translateY(-1px);
    }

    .clear-button:active,
    .clear-all-button:active {
      transform: translateY(2px);
    }

    .clear-button:focus-visible,
    .clear-all-button:focus-visible,
    .line-text:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .notepad {
        padding: 1.2rem 1rem;
      }

      .stats-header h1 {
        font-size: 1.4rem;
      }

      .editor {
        font-size: 0.9rem;
        line-height: 1.5rem;
      }

      .line-row {
        line-height: 1.5rem;
        height: 1.5rem;
      }

      .line-text {
        line-height: 1.5rem;
      }

      .notepad-body {
        height: 420px;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script>
    const {
      useState,
      useEffect,
      useRef,
      createElement: h
    } = React;

    const COLOR_PALETTE = [
      '#fde047',
      '#60a5fa',
      '#4ade80',
      '#bef264',
      '#d1d5db',
      '#fb923c',
      '#f9a8d4',
      '#c084fc',
      '#e879f9',
      '#000000',
      '#ffd700'
    ];

    const DEFAULT_LINES = [
      {
        text: '1.92  |  Arsenal vs Chelsea  @ 1.92',
        color: null
      },
      {
        text: '2.05  |  Lakers -3.5  @ 2.05',
        color: null
      },
      {
        text: '1.75  |  Over 2.5 goals  Bayern vs Dortmund',
        color: null
      },
      {
        text: '2.45  |  Djokovic to win 1st set  @ 2.45',
        color: null
      },
      {
        text: '3.10  |  Yankees -1.5  @ 3.10',
        color: null
      }
    ];

    const STORAGE_KEY = 'bettingOddsLinesV10';

    function pickRandomColor() {
      return COLOR_PALETTE[
        Math.floor(Math.random() * COLOR_PALETTE.length)
      ];
    }

    function App() {
      const [lines, setLines] = useState(function () {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);

          if (saved) {
            const parsed = JSON.parse(saved);

            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed.map(function (line) {
                return {
                  text: typeof line.text === 'string' ? line.text : '',
                  color: line.color || null
                };
              });
            }
          }
        } catch (error) {
          // Use default lines if local storage is unavailable.
        }

        return DEFAULT_LINES;
      });

      const editorRef = useRef(null);

      useEffect(function () {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(lines));
        } catch (error) {
          // Ignore storage errors.
        }
      }, [lines]);

      const updateLineText = function (index, newText) {
        const cleanText = String(newText || '')
          .replace(/[\r\n]+/g, ' ');

        setLines(function (previousLines) {
          const nextLines = previousLines.slice();

          while (nextLines.length <= index) {
            nextLines.push({
              text: '',
              color: null
            });
          }

          if (nextLines[index].text === cleanText) {
            return previousLines;
          }

          nextLines[index] = Object.assign(
            {},
            nextLines[index],
            {
              text: cleanText
            }
          );

          return nextLines;
        });
      };

      const focusLineEnd = function (index) {
        setTimeout(function () {
          const lineElement = document.querySelector(
            '[data-line-index="' + index + '"] .line-text'
          );

          if (!lineElement) {
            return;
          }

          lineElement.focus();

          const range = document.createRange();

          if (
            lineElement.lastChild &&
            lineElement.lastChild.nodeType === Node.TEXT_NODE
          ) {
            range.setStart(
              lineElement.lastChild,
              lineElement.lastChild.textContent.length
            );
            range.collapse(true);
          } else {
            range.selectNodeContents(lineElement);
            range.collapse(false);
          }

          const selection = window.getSelection();

          if (selection) {
            selection.removeAllRanges();
            selection.addRange(range);
          }

          lineElement.scrollIntoView({
            block: 'nearest',
            inline: 'nearest'
          });
        }, 0);
      };

      const handleKeyDown = function (event, index) {
        if (event.key === 'Enter') {
          event.preventDefault();
          event.stopPropagation();

          const newLine = {
            text: '',
            color: pickRandomColor()
          };

          setLines(function (previousLines) {
            const nextLines = previousLines.slice();
            nextLines.splice(index + 1, 0, newLine);
            return nextLines;
          });

          focusLineEnd(index + 1);
          return;
        }

        if (event.key === 'ArrowDown') {
          if (index < lines.length - 1) {
            event.preventDefault();
            focusLineEnd(index + 1);
          }

          return;
        }

        if (event.key === 'ArrowUp') {
          if (index > 0) {
            event.preventDefault();
            focusLineEnd(index - 1);
          }

          return;
        }
      };

      const handlePaste = function (event) {
        event.preventDefault();

        const clipboard = event.clipboardData || window.clipboardData;

        if (!clipboard) {
          return;
        }

        const pastedText = clipboard
          .getData('text')
          .replace(/[\r\n]+/g, ' ');

        /*
         * Insert plain text only. This prevents pasted Arabic/RTL HTML
         * formatting from changing the direction of the line.
         */
        if (document.execCommand) {
          document.execCommand(
            'insertText',
            false,
            pastedText
          );
        } else {
          const selection = window.getSelection();

          if (selection && selection.rangeCount > 0) {
            selection.deleteFromDocument();
            selection
              .getRangeAt(0)
              .insertNode(document.createTextNode(pastedText));
          }
        }
      };

      const handleClearAll = function () {
        if (
          window.confirm(
            '⚠️ Clear ALL notes? This cannot be undone.'
          )
        ) {
          setLines([
            {
              text: '',
              color: null
            }
          ]);

          focusLineEnd(0);
        }
      };

      const totalChars = lines.reduce(function (sum, line) {
        return sum + (line.text ? line.text.length : 0);
      }, 0);

      const actualLines = lines.length;

      return h(
        'div',
        {
          className: 'notepad',
          dir: 'ltr'
        },

        h(
          'div',
          {
            className: 'stats-header',
            dir: 'ltr'
          },

          h(
            'h1',
            {
              dir: 'ltr'
            },
            h('span', null, '📊'),
            ' Odds Notepad'
          ),

          h(
            'div',
            {
              className: 'badge',
              dir: 'ltr'
            },
            'Press Enter → new line below'
          )
        ),

        h(
          'div',
          {
            className: 'notepad-body',
            dir: 'ltr'
          },

          h(
            'div',
            {
              className: 'editor-scroll',
              dir: 'ltr'
            },

            h(
              'div',
              {
                className: 'editor',
                ref: editorRef,
                dir: 'ltr',
                spellCheck: false
              },

              lines.map(function (line, index) {
                const isBlack = line.color === '#000000';

                return h(
                  'div',
                  {
                    key: index,
                    'data-line-index': index,
                    className: 'line-row',
                    dir: 'ltr',
                    style: line.color
                      ? {
                          backgroundColor: line.color,
                          color: isBlack
                            ? '#ffffff'
                            : '#1e293b'
                        }
                      : {}
                  },

                  h(
                    'div',
                    {
                      className: 'line-text',

                      /*
                       * plaintext-only stops the browser from creating
                       * nested RTL divs or spans while typing/pasting.
                       */
                      contentEditable: 'plaintext-only',

                      suppressContentEditableWarning: true,
                      spellCheck: false,
                      dir: 'ltr',
                      lang: 'en-US',
                      translate: 'no',
                      inputMode: 'text',
                      autoCorrect: 'off',
                      autoCapitalize: 'off',

                      style: {
                        direction: 'ltr',
                        textAlign: 'left',
                        unicodeBidi: 'isolate',
                        writingMode: 'horizontal-tb'
                      },

                      'data-placeholder':
                        index === 0
                          ? 'Type here... press Enter to go to next line'
                          : '',

                      onInput: function (event) {
                        updateLineText(
                          index,
                          event.currentTarget.textContent
                        );
                      },

                      onKeyDown: function (event) {
                        handleKeyDown(event, index);
                      },

                      onPaste: handlePaste
                    },

                    line.text
                  )
                );
              })
            )
          )
        ),

        h(
          'div',
          {
            className: 'stats-footer',
            dir: 'ltr'
          },

          h(
            'div',
            {
              style: {
                display: 'flex',
                gap: '0.75rem',
                flexWrap: 'wrap',
                direction: 'ltr'
              },
              dir: 'ltr'
            },

            h(
              'div',
              {
                className: 'stat-item',
                dir: 'ltr'
              },
              '📝 ',
              actualLines,
              ' ',
              actualLines === 1 ? 'line' : 'lines'
            ),

            h(
              'div',
              {
                className: 'stat-item',
                dir: 'ltr'
              },
              '🔤 ',
              totalChars,
              ' chars'
            ),

            h(
              'div',
              {
                className: 'storage-note',
                dir: 'ltr'
              },
              'autosaved'
            )
          ),

          h(
            'div',
            {
              className: 'button-group',
              dir: 'ltr'
            },

            h(
              'button',
              {
                type: 'button',
                className: 'clear-button',
                onClick: handleClearAll,
                dir: 'ltr'
              },
              '🧹 Clear notes'
            ),

            h(
              'button',
              {
                type: 'button',
                className: 'clear-all-button',
                onClick: handleClearAll,
                dir: 'ltr'
              },
              '🗑️ Clear All'
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(
      document.getElementById('root')
    );

    root.render(h(App));
  </script>
</body>
</html>
