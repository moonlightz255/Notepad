<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odds Notepad · Colored Lines</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body,
    #root {
      direction: ltr !important;
      text-align: left !important;
      unicode-bidi: isolate !important;
      writing-mode: horizontal-tb !important;
    }

    body {
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f4ff;
      padding: 1.5rem;
    }

    #root {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .notepad {
      background: #fffdf5;
      border-radius: 28px;
      box-shadow:
        0 20px 35px rgba(0, 0, 0, 0.15),
        0 6px 12px rgba(0, 0, 0, 0.08);
      padding: 1.8rem;
      border: 1px solid rgba(59, 130, 246, 0.3);
      direction: ltr !important;
    }

    .stats-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.75rem;
      border-bottom: 3px dashed #3b82f6;
      padding-bottom: 0.75rem;
    }

    .stats-header h1 {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      background: #dbeafe;
      color: #1e3a8a;
      padding: 0.35rem 1rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.85rem;
      border: 1px solid #60a5fa;
    }

    .notepad-body {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #bfdbfe;
      overflow: hidden;
      height: 520px;
    }

    .editor-scroll {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      background: #ffffff;
    }

    .editor-scroll::-webkit-scrollbar {
      width: 8px;
    }

    .editor-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .editor {
      padding: 0.75rem 1rem;
      font-family: 'Courier New', 'Fira Code', monospace;
      font-size: 1rem;
      line-height: 1.65rem;
      color: #1e293b;
      font-weight: 500;
      min-height: 100%;
      direction: ltr !important;
      text-align: left !important;
      unicode-bidi: isolate !important;
    }

    /*
     * The row itself has no background.
     * This prevents black/colored blocks appearing on the left and right.
     */
    .line-row {
      display: block;
      width: 100%;
      min-height: 1.65rem;
      line-height: 1.65rem;
      padding: 0;
      overflow: hidden;
      direction: ltr !important;
      text-align: left !important;
      unicode-bidi: isolate !important;
    }

    /*
     * Only the written text receives the background color.
     * The empty/current line stays white.
     */
    .line-text {
      display: inline-block;
      vertical-align: top;
      max-width: 100%;
      min-width: 1px;
      height: 1.65rem;
      padding: 0 0.5rem;
      border-radius: 4px;

      outline: none;
      cursor: text;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      line-height: 1.65rem;
      color: #1e293b;

      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;

      direction: ltr !important;
      text-align: left !important;
      unicode-bidi: isolate !important;
      writing-mode: horizontal-tb !important;

      transition: background-color 0.2s ease;
    }

    .line-text:focus {
      direction: ltr !important;
      text-align: left !important;
      unicode-bidi: isolate !important;
    }

    .line-text::-webkit-scrollbar {
      display: none;
    }

    .line-text:empty {
      background: transparent !important;
    }

    .line-text::selection {
      background: #93c5fd;
      color: #0f172a;
    }

    .line-text *,
    .line-text span,
    .line-text div,
    .line-text br {
      direction: ltr !important;
      text-align: left !important;
      unicode-bidi: isolate !important;
      writing-mode: horizontal-tb !important;
    }

    .editor .line-row:first-child .line-text:empty::before {
      content: attr(data-placeholder);
      color: #94a3b8;
      font-style: italic;
      pointer-events: none;
    }

    .stats-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.25rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-stats {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .stat-item {
      background: #eff6ff;
      border-radius: 40px;
      padding: 0.4rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #1e3a8a;
      border: 1px solid #bfdbfe;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .storage-note {
      font-size: 0.75rem;
      color: #1e3a8a;
      background: #eff6ff;
      padding: 0.25rem 0.75rem;
      border-radius: 30px;
      border: 1px solid #bfdbfe;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .storage-note::before {
      content: "💾";
    }

    .button-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .clear-button,
    .clear-all-button {
      font-family: inherit;
      font-weight: 700;
      padding: 0.5rem 1.4rem;
      border-radius: 40px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s;
    }

    .clear-button {
      background: #eff6ff;
      border: 1.5px solid #2563eb;
      color: #1e3a8a;
      box-shadow: 0 3px 0 #1e40af;
    }

    .clear-all-button {
      background: #fee2e2;
      border: 1.5px solid #dc2626;
      color: #991b1b;
      box-shadow: 0 3px 0 #b91c1c;
    }

    .clear-button:hover,
    .clear-all-button:hover {
      transform: translateY(-1px);
    }

    .clear-button:active,
    .clear-all-button:active {
      transform: translateY(2px);
    }

    .clear-button:focus-visible,
    .clear-all-button:focus-visible,
    .line-text:focus-visible {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .notepad {
        padding: 1.2rem 1rem;
      }

      .stats-header h1 {
        font-size: 1.4rem;
      }

      .editor {
        font-size: 0.9rem;
        line-height: 1.5rem;
      }

      .line-row {
        min-height: 1.5rem;
        line-height: 1.5rem;
      }

      .line-text {
        height: 1.5rem;
        line-height: 1.5rem;
      }

      .notepad-body {
        height: 420px;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script>
    const {
      useState,
      useEffect,
      useRef,
      createElement: h
    } = React;

    /*
     * Black was removed from the palette so a black background
     * cannot appear accidentally.
     */
    const COLOR_PALETTE = [
      '#fde047',
      '#93c5fd',
      '#86efac',
      '#bef264',
      '#d1d5db',
      '#fdba74',
      '#f9a8d4',
      '#d8b4fe',
      '#f0abfc',
      '#fcd34d'
    ];

    const DEFAULT_LINES = [
      {
        id: 'line-1',
        text: '1.92  |  Arsenal vs Chelsea  @ 1.92',
        color: null
      },
      {
        id: 'line-2',
        text: '2.05  |  Lakers -3.5  @ 2.05',
        color: null
      },
      {
        id: 'line-3',
        text: '1.75  |  Over 2.5 goals  Bayern vs Dortmund',
        color: null
      },
      {
        id: 'line-4',
        text: '2.45  |  Djokovic to win 1st set  @ 2.45',
        color: null
      },
      {
        id: 'line-5',
        text: '3.10  |  Yankees -1.5  @ 3.10',
        color: null
      }
    ];

    const STORAGE_KEY = 'bettingOddsLinesV11';

    function createLine(text, color) {
      return {
        id: 'line-' + Date.now() + '-' + Math.random(),
        text: text || '',
        color: color || null
      };
    }

    function pickRandomColor() {
      return COLOR_PALETTE[
        Math.floor(Math.random() * COLOR_PALETTE.length)
      ];
    }

    function getTextColor(backgroundColor) {
      if (!backgroundColor) {
        return '#1e293b';
      }

      const color = backgroundColor.replace('#', '');

      const red = parseInt(color.substring(0, 2), 16);
      const green = parseInt(color.substring(2, 4), 16);
      const blue = parseInt(color.substring(4, 6), 16);

      const brightness =
        (red * 299 + green * 587 + blue * 114) / 1000;

      return brightness < 150 ? '#ffffff' : '#1e293b';
    }

    function App() {
      const [lines, setLines] = useState(function () {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);

          if (saved) {
            const parsed = JSON.parse(saved);

            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed.map(function (line, index) {
                return {
                  id: line.id || 'saved-line-' + index,
                  text: typeof line.text === 'string'
                    ? line.text
                    : '',
                  color: line.color || null
                };
              });
            }
          }
        } catch (error) {
          // Use default lines if storage is unavailable.
        }

        return DEFAULT_LINES;
      });

      const editorRef = useRef(null);

      useEffect(function () {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(lines));
        } catch (error) {
          // Ignore storage errors.
        }
      }, [lines]);

      const updateLineText = function (index, newText) {
        const cleanText = String(newText || '')
          .replace(/[\r\n]+/g, ' ');

        setLines(function (previousLines) {
          const nextLines = previousLines.slice();

          if (!nextLines[index]) {
            return previousLines;
          }

          if (nextLines[index].text === cleanText) {
            return previousLines;
          }

          nextLines[index] = Object.assign(
            {},
            nextLines[index],
            {
              text: cleanText
            }
          );

          return nextLines;
        });
      };

      const focusLineEnd = function (index) {
        setTimeout(function () {
          const lineElement = document.querySelector(
            '[data-line-index="' + index + '"] .line-text'
          );

          if (!lineElement) {
            return;
          }

          lineElement.focus();

          const range = document.createRange();
          range.selectNodeContents(lineElement);
          range.collapse(false);

          const selection = window.getSelection();

          if (selection) {
            selection.removeAllRanges();
            selection.addRange(range);
          }

          lineElement.scrollIntoView({
            block: 'nearest',
            inline: 'nearest'
          });
        }, 30);
      };

      const handleKeyDown = function (event, index) {
        if (event.key === 'Enter') {
          event.preventDefault();
          event.stopPropagation();

          const currentText = event.currentTarget.textContent
            .replace(/[\r\n]+/g, ' ')
            .trim();

          setLines(function (previousLines) {
            const nextLines = previousLines.slice();

            /*
             * Pressing Enter commits the current words and colors
             * the current line.
             */
            if (currentText.length > 0) {
              nextLines[index] = Object.assign(
                {},
                nextLines[index],
                {
                  text: currentText,
                  color: nextLines[index].color || pickRandomColor()
                }
              );
            }

            /*
             * The new line is empty and has no background yet.
             * It will receive a color when Enter is pressed on it.
             */
            nextLines.splice(
              index + 1,
              0,
              createLine('', null)
            );

            return nextLines;
          });

          focusLineEnd(index + 1);
          return;
        }

        if (event.key === 'ArrowDown') {
          if (index < lines.length - 1) {
            event.preventDefault();
            focusLineEnd(index + 1);
          }

          return;
        }

        if (event.key === 'ArrowUp') {
          if (index > 0) {
            event.preventDefault();
            focusLineEnd(index - 1);
          }

          return;
        }
      };

      const handlePaste = function (event) {
        event.preventDefault();

        const clipboard =
          event.clipboardData || window.clipboardData;

        if (!clipboard) {
          return;
        }

        const pastedText = clipboard
          .getData('text')
          .replace(/[\r\n]+/g, ' ');

        document.execCommand(
          'insertText',
          false,
          pastedText
        );
      };

      const handleClearAll = function () {
        if (
          window.confirm(
            '⚠️ Clear ALL notes? This cannot be undone.'
          )
        ) {
          setLines([
            createLine('', null)
          ]);

          focusLineEnd(0);
        }
      };

      const totalChars = lines.reduce(function (sum, line) {
        return sum + line.text.length;
      }, 0);

      return h(
        'div',
        {
          className: 'notepad',
          dir: 'ltr'
        },

        h(
          'div',
          {
            className: 'stats-header'
          },

          h(
            'h1',
            null,
            h('span', null, '📊'),
            ' Odds Notepad'
          ),

          h(
            'div',
            {
              className: 'badge'
            },
            'Type → press ↵ to highlight and continue'
          )
        ),

        h(
          'div',
          {
            className: 'notepad-body'
          },

          h(
            'div',
            {
              className: 'editor-scroll'
            },

            h(
              'div',
              {
                className: 'editor',
                ref: editorRef,
                dir: 'ltr'
              },

              lines.map(function (line, index) {
                const hasColor =
                  Boolean(line.color) && line.text.length > 0;

                const textStyle = hasColor
                  ? {
                      backgroundColor: line.color,
                      color: getTextColor(line.color)
                    }
                  : {
                      backgroundColor: 'transparent',
                      color: '#1e293b'
                    };

                return h(
                  'div',
                  {
                    key: line.id,
                    'data-line-index': index,
                    className: 'line-row',
                    dir: 'ltr'
                  },

                  h(
                    'div',
                    {
                      className: 'line-text',
                      contentEditable: true,
                      suppressContentEditableWarning: true,
                      spellCheck: false,
                      dir: 'ltr',
                      lang: 'en-US',
                      translate: 'no',
                      inputMode: 'text',
                      autoCorrect: 'off',
                      autoCapitalize: 'off',
                      style: textStyle,

                      'data-placeholder':
                        index === 0
                          ? 'Type here... press ↵ for the next colored line'
                          : '',

                      onInput: function (event) {
                        updateLineText(
                          index,
                          event.currentTarget.textContent
                        );
                      },

                      onKeyDown: function (event) {
                        handleKeyDown(event, index);
                      },

                      onPaste: handlePaste
                    },

                    line.text
                  )
                );
              })
            )
          )
        ),

        h(
          'div',
          {
            className: 'stats-footer'
          },

          h(
            'div',
            {
              className: 'footer-stats'
            },

            h(
              'div',
              {
                className: 'stat-item'
              },
              '📝 ',
              lines.length,
              ' ',
              lines.length === 1 ? 'line' : 'lines'
            ),

            h(
              'div',
              {
                className: 'stat-item'
              },
              '🔤 ',
              totalChars,
              ' chars'
            ),

            h(
              'div',
              {
                className: 'storage-note'
              },
              'autosaved'
            )
          ),

          h(
            'div',
            {
              className: 'button-group'
            },

            h(
              'button',
              {
                type: 'button',
                className: 'clear-button',
                onClick: handleClearAll
              },
              '🧹 Clear notes'
            ),

            h(
              'button',
              {
                type: 'button',
                className: 'clear-all-button',
                onClick: handleClearAll
              },
              '🗑️ Clear All'
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(
      document.getElementById('root')
    );

    root.render(h(App));
  </script>
</body>
  </html>
